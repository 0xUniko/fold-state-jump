name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: bun test
      - run: bun run build
      - run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev
      - run: cmake -S native -B native/build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang
      - run: cmake --build native/build -j 2
      - run: |
          ./native/build/fold-state-jump-ast --source test/fixtures/native-fold.cpp -- -std=c++17 > /tmp/fold-state-jump-ast.json
          node -e 'const a=require("/tmp/fold-state-jump-ast.json"); if(a.kind!=="TranslationUnitDecl" || !a.inner.some(n=>n.name==="example")) process.exit(1)'
          bun run test/native-integration.ts
          node -e 'if(require("node:fs").statSync("/tmp/fold-state-jump-ast.json").size > 1000000) process.exit(1)'
      - run: bun run bench test/fixtures/native-paths.cpp bank_state.bank.records 10

